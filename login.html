<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./responsiveness.css">
    <link rel="icon" href="./cowry.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
 
</head>

<body style="background-color: #f4f7fa;">

    <div class="Log-in-logo">
        <img src="./download (19).svg" alt="">
    </div>


    <div class="form-container">
        <div class="log-in-left">
            <h1>Jump right in</h1>
            <h2>Sign in to continue</h2>
            <div style="margin-top: 10px;">
                <span>New user? <a href="./signup.html">Create account</a></span>
            </div>
        </div>



        <div class="box">
            <!-- <form action=""> -->
                <div class="form" style="display: flex; flex-direction: column; width: 80%; margin: 60px auto;">

                    <div class="google-apple"
                        style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px;">
                        <button style="display: flex; align-items: center; border: 2px solid #e0e4eb; width: 48%; text-decoration: none; padding: 8px 28px; color: black; font-weight: 500; border-radius: 5px;background-color: white;"
                            onclick="googleSign()">
                            <img src="./download (20).svg" alt="" style="margin-right: 8px;">
                            <p style="margin: 0px; font-size: 14px;">Sign In with Google</p>
                </button>

                        <a style="display: flex; align-items: center; border: 2px solid #e0e4eb; width: 48%; text-decoration: none; padding: 8px 29px; color: black; font-weight: 500; border-radius: 5px;"
                            href="">
                            <img src="./download (22).svg" alt="" style="width: 20px; margin-right: 8px;">
                            <p style="margin: 0; font-size: 14px;">Sign In with Apple</p>
                        </a>
                    </div>
                    <div class="divider">or</div> <br>
                    <form id="loginForm">
                        <div class="input-container">
                            <input type="email" id="email" placeholder=" " required>
                            <label for="email">Email Address</label>
                        </div>

                        <div class="input-container">
                            <input type="password" id="pass" placeholder=" " required>
                            <label for="pass">Password</label>
                        </div>
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                        <a href="forgot-password.html">Forget password?</a> <br> <br>
                        <button type="submit" style="width: 100%;">Sign in</button>
                    </form>
                </div> <br>
                <div class="help-section" style="display: flex; justify-content: space-between;">
                    <span>Trouble signing in? <a
                            style="text-decoration: none; color: #0368f5; font-size: 14px;font-weight: 600;"
                            href="">Chat with us</a></span>
                    <a style="color: #6c83a3; text-decoration: none; font-size: 14px;" href="">Privacy | Terms</a>
                </div>
            <!-- </form> -->
        </div>

    </div>


</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDThMga0C_4Z00olgnFb2U02HvI3hQiGsM",
        authDomain: "cowrywiseproject-level1.firebaseapp.com",
        projectId: "cowrywiseproject-level1",
        storageBucket: "cowrywiseproject-level1.firebasestorage.app",
        messagingSenderId: "494631458624",
        appId: "1:494631458624:web:7b757935ad646b1dc78ca5",
        measurementId: "G-JW3C58MBXL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.googleSign = async function() {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            
            // Check if user has an account in the persistent accounts list
            const allUserAccounts = JSON.parse(localStorage.getItem('allUserAccounts')) || [];
            const existingAccount = allUserAccounts.find(account => account.email === user.email);
            
            // If user has a complete account (with profile and PIN created)
            if (existingAccount && existingAccount.firstName && existingAccount.password) {
                // User has complete account - log them in to dashboard
                const updatedData = {
                    ...existingAccount,
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL,
                    uid: user.uid,
                    isGoogleAuth: true,
                    lastLogin: new Date().toISOString()
                };
                
                localStorage.setItem('userData', JSON.stringify(updatedData));
                localStorage.setItem('userEmail', user.email);
                
                // Also set the PIN if it exists
                const storedPin = localStorage.getItem('userPin');
                if (storedPin) {
                    localStorage.setItem('userPin', storedPin);
                }
                
                window.location.href = 'dashboard.html';
            } else {
                // Account does not exist - show error and stay on login page
                Toastify({
                    text: "No account found. Please sign up first.",
                    duration: 3000,
                    gravity: "top",
                    position: "center",
                    style: {
                        background: "#e74c3c",
                        color: "white"
                    }
                }).showToast();
                
                // Clear any temporary data
                localStorage.removeItem('userData');
            }
        } catch (error) {
            console.error("Google Sign In Error:", error);
        }
    };
    
    // Handle email/password login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('pass').value.trim();
        
        // Validate inputs
        if (!email || !password) {
            Toastify({
                text: "Please fill in all fields",
                duration: 3000,
                gravity: "top",
                position: "center",
                style: {
                    background: "#e74c3c",
                    color: "white"
                }
            }).showToast();
            return;
        }
        
        // Get all stored user accounts
        const allUserAccounts = JSON.parse(localStorage.getItem('allUserAccounts')) || [];
        
        // Find matching account
        const matchingAccount = allUserAccounts.find(account => 
            account.email === email && account.password === password
        );
        
        if (matchingAccount) {
            // User found - set as current user and go to dashboard
            localStorage.setItem('userData', JSON.stringify({
                ...matchingAccount,
                lastLogin: new Date().toISOString()
            }));
            
            Toastify({
                text: "Login successful!",
                duration: 2000,
                gravity: "top",
                position: "center",
                style: {
                    background: "green",
                    color: "white"
                }
            }).showToast();
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        } else {
            Toastify({
                text: "Invalid email or password",
                duration: 3000,
                gravity: "top",
                position: "center",
                style: {
                    background: "#e74c3c",
                    color: "white"
                }
            }).showToast();
        }
    });
    
    // Password toggle visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
        const passInput = document.getElementById('pass');
        const icon = document.getElementById('togglePassword');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
</html>
