    <script src="signup.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDThMga0C_4Z00olgnFb2U02HvI3hQiGsM",
            authDomain: "cowrywiseproject-level1.firebaseapp.com",
            projectId: "cowrywiseproject-level1",
            storageBucket: "cowrywiseproject-level1.firebasestorage.app",
            messagingSenderId: "494631458624",
            appId: "1:494631458624:web:7b757935ad646b1dc78ca5",
            measurementId: "G-JW3C58MBXL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleSign = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                const userData = {
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL,
                    uid: user.uid,
                    isGoogleAuth: true
                };
                
                localStorage.setItem('userData', JSON.stringify(userData));
                localStorage.setItem('userEmail', user.email);
                
                window.showLoaderAndRedirect('complete-profile.html');
            } catch (error) {
                console.error("Google Sign Up Error:", error);
            }
        };
    </script>
